<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Certificate Gallery - Sean Script</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d1b2a;
            --card-bg: #071626;
            --accent: #00bcd4;
            --accent-contrast: #062028;
            --major: #0b7a36;
            --minor: #0e6fb8;
            --text: #e0f7fa;
            --muted: #9fb7c9;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* allow vertical scrolling on small devices while preventing horizontal overflow */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(.4,0,.2,1);
        }

        body.fade-out {
            opacity: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* start at the top so content is visible on small devices */
            position: relative;
            /* allow vertical scrolling by default; media queries can tighten this if needed */
            overflow-y: auto;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            -webkit-overflow-scrolling: touch;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.9rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 16, 30, 0.6);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .header-center {
            flex: 2;
            text-align: center;
        }

        .logo {
            width: 3.0rem;
            height: 3.0rem;
            display: flex;
            align-items: center;
            justify-content: left;
        }
        .logo img { height: 36px; width: auto; display: block; }

        .header-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            text-align: left;
            text-transform: none;
            letter-spacing: 0.2px;
        }

        /* Back button container */
        .back-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .back-line {
            display: none; /* remove decorative line to reduce clutter */
        }

        .back-button {
            color: #ffffff;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.03);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .back-button:hover::before {
            left: 0;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.03);
            transform: translateY(-2px);
        }

        .back-button:focus {
            outline: 3px solid rgba(255,255,255,0.08);
            box-shadow: 0 12px 30px rgba(255,255,255,0.06);
            transform: translateY(-2px);
        }

        /* Main Container */
        .main-container {
            width: 100%;
            min-height: calc(100vh - 96px); /* leave space for fixed header */
            height: auto;
            padding-top: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* keep content anchored to top on small screens */
            position: relative;
            box-sizing: border-box;
        }

        /* Reduce header spacing for smaller viewports so content stays visible */
        @media (max-width: 768px) {
            .main-container { padding-top: 72px; min-height: calc(100vh - 72px); }
        }

        @media (max-width: 480px) {
            .main-container { padding-top: 64px; min-height: calc(100vh - 64px); }
        }

        /* Polygonal Background */
        .polygon-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            opacity: 0.12;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .polygon-bg { display: none; }
        }

        .polygon {
            position: absolute;
            background: rgba(33, 150, 243, 0.05);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            animation: float 20s infinite linear;
            filter: blur(0.6px);
        }

        .polygon:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .polygon:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 10%;
            animation-delay: -5s;
        }

        .polygon:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 20%;
            animation-delay: -10s;
        }

        .polygon:nth-child(4) {
            width: 120px;
            height: 120px;
            top: 30%;
            right: 20%;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, 30px) rotate(90deg);
            }
            50% {
                transform: translate(0, 60px) rotate(180deg);
            }
            75% {
                transform: translate(-30px, 30px) rotate(270deg);
            }
        }

        /* Carousel Container */
        .carousel-container {
            width: 95%;
            max-width: 1400px;
            height: 65vh;
            position: relative;
            margin: 0 auto;
            perspective: 1000px;
        }

        /* Carousel Track */
        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            align-items: center;
            gap: 1rem;
            padding: 0 1.5rem;

            /* Keep horizontal scrolling where enabled but hide the native scrollbar visually */
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        /* WebKit browsers (Chrome, Safari) - hide the horizontal scrollbar */
        .carousel-track::-webkit-scrollbar {
            height: 0;
            display: none;
        }

        /* Utility: screen-reader only */
        .sr-only { position: absolute !important; height: 1px; width: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; }

        /* Mobile: use scroll-snap for natural swipe on small viewports */
        @media (max-width: 768px) {
            .carousel-track {
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 0.8rem;
                padding: 0 1rem;
            }

            .certificate-card {
                scroll-snap-align: center;
                flex: 0 0 82%;
                min-width: 82%;
            }

            .carousel-nav { display: none; }
            .carousel-container { height: auto; padding-bottom: 1rem; }
        }

        /* Certificate Card (simplified) */
        .certificate-card {
            flex: 0 0 280px;
            background: #071626;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 6px 18px rgba(2,8,18,0.6);
            cursor: pointer;
            height: auto;
            display: flex;
            flex-direction: column;
        }

        /* Active (current) card visual */
        .certificate-card.active {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(2,8,18,0.7);
            z-index: 4;
        }

        /* Hovered card */
        .certificate-card.hovered {
            transform: translateY(-6px);
            box-shadow: 0 10px 24px rgba(2,8,18,0.65);
            z-index: 5;
        }

        /* Card Header (tight) */
        .card-header {
            height: 56px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            padding: 0 1rem;
            gap: 0.6rem;
        }

        .certificate-icon {
            font-size: 1.8rem;
            color: var(--accent);
            margin-right: 0.6rem;
            z-index: 2;
        }

        /* Card Content */
        .card-content {
            padding: 0.8rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .certificate-title {
            font-size: 1.12rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #ffffff;
            line-height: 1.42;
            max-height: calc(1.42em * 2);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-wrap: break-word;
            hyphens: auto;
            overflow-wrap: break-word;
        }

        .certificate-type {
            font-size: 0.78rem;
            margin-bottom: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.28rem 0.7rem;
            border-radius: 12px;
            width: fit-content;
            font-weight: 600;
        }

        .certificate-type.major {
            color: #11aa4c;
            background: rgba(11, 122, 54, 0.08);
            border: 1px solid rgba(11, 122, 54, 0.15);
        }

        .certificate-type.minor {
            color: #2a91df;
            background: rgba(14, 111, 184, 0.08);
            border: 1px solid rgba(14, 111, 184, 0.15);
        }

        .certificate-issuer {
            font-size: 0.9rem;
            color: #9fb7c9;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .certificate-issuer i {
            color: #0e6fb8;
        }

        .certificate-date {
            font-size: 0.85rem;
            color: #8aa9bf;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .certificate-date i {
            color: #0db8c0;
        }

        .view-btn {
            margin-top: 0.6rem;
            padding: 0.7rem 0.9rem;
            background: var(--accent);
            border: none;
            color: var(--accent-contrast);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
            text-align: center;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden; /* ensure overlay clips to button */
        }

        /* Dark left-to-right overlay that slides in from the left */
        .view-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: rgba(18, 85, 93, 0.329);
            transition: width 0.7s ease;
            z-index: -1;
        }

        .view-btn:hover::before {
            width: 100%;
        }


        .open-cert-btn {
            position: relative;
            overflow: hidden;
        }

        .open-cert-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: rgba(18, 85, 93, 0.329);
            transition: width 0.7s ease;
            z-index: -1;
        }

        .open-cert-btn:hover::before {
            width: 100%;
        }

        /* Modal CTA: make overlay darker and slide left->right like the view button */
        .modal-open-btn {
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

      
        .modal-open-btn:hover::before {
            left: 0;
        }

        /* Keep hover color stable and accessible */
        .modal-open-btn:hover {
            color: var(--accent-contrast);
        }

        .modal-open-btn:focus {
            outline: 3px solid rgba(0,188,212,0.14);
        }

        /* Navigation Arrows */
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 10;
            pointer-events: none;
        }

        .nav-arrow {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.04);
            color: #00bcd4;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.18s ease, background 0.18s ease;
            pointer-events: auto;
            border: none;
        }

        .nav-arrow:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,0.06);
        }

        /* Indicators */
        .carousel-indicators {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
            padding: 0.4rem 0.6rem;
            background: transparent;
            border-radius: 12px;
            position: relative;
        }



        .indicator {
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
            border: none;
            padding: 0;
            appearance: none;
        }

        .indicator.active {
            background: var(--accent);
            transform: scale(1.15);
        }

        .indicator:hover {
            background: rgba(0, 188, 212, 0.15);
        }

        .indicator:focus { outline: 3px solid rgba(0,188,212,0.12); }


        /* Legend */
        .legend {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            padding: 1rem 2rem;
    
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid;
        }

        .legend-color.major {
            background: var(--major);
            border-color: rgba(11,122,54,0.9);
        }

        .legend-color.minor {
            background: var(--minor);
            border-color: rgba(14,111,184,0.9);
        }

        /* Certificate Modal */
        .cert-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .cert-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            background: rgba(0, 30, 60, 0.95);
            border-radius: 20px;
            padding: 3.0rem;
            position: relative;
            border: 2px solid rgba(33, 150, 243, 0.4);
            overflow-y: auto;
        }

        .certificate-inner-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        .certificate-viewer {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .certificate-viewer.active {
            display: flex;
        }

        .certificate-iframe, .certificate-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            border: 2px solid rgba(33, 150, 243, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            background: rgba(0,188,212,0.06);
            border: 1px solid rgba(0,188,212,0.12);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
            font-size: 1.1rem;
        }

        .modal-close:hover {
            background: rgba(0,188,212,0.09);
            transform: rotate(90deg);
            color: var(--accent);
        }

        .modal-close:focus { outline: 3px solid rgba(0,188,212,0.14); }

        .nav-arrow:focus { outline: none; box-shadow: 0 0 0 4px rgba(0,188,212,0.08); transform: translateY(-3px); }

        /* Responsive Design */
        @media (min-width: 1201px) {
            .carousel-container { height: 70vh; }
            .certificate-card { flex: 0 0 350px; }
            .header-title { font-size: 2rem; }
            .nav-arrow { width: 70px; height: 70px; font-size: 1.4rem; }
        }

        @media (max-width: 1200px) {
            .carousel-container { height: 60vh; }
            .certificate-card { flex: 0 0 320px; }
        }

        @media (max-width: 992px) {
            .carousel-container { height: 58vh; }
            .certificate-card { flex: 0 0 280px; }
            .header-title { font-size: 1.5rem; }
        }

        /* Tablet and small desktops */
        @media (max-width: 768px) {
            body { overflow: auto; }
            .carousel-container { height: auto; padding-bottom: 1.25rem; }
            .carousel-track { overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; gap: 0.8rem; padding: 0 1rem; }
            .certificate-card { flex: 0 0 82%; min-width: 82%; scroll-snap-align: center; overflow-y: visible; }
            .certificate-title { font-size: 1rem; -webkit-line-clamp: 2; }
            .view-btn { padding: 0.9rem 1rem; font-size: 1rem; }
            .modal-open-btn { padding: 0.9rem 1rem; font-size: 1rem; }
            /* Keep arrows visible on small screens but make them smaller and less intrusive */
            .nav-arrow { display: flex; width: 44px; height: 44px; font-size: 0.95rem; background: rgba(255,255,255,0.06); color: var(--accent); border-radius: 50%; box-shadow: 0 6px 16px rgba(2,8,18,0.5); }
            .modal-content { max-width: 95%; width: 95%; padding: 1.5rem; border-radius: 12px; max-height: 90vh; }
            .modal-close { width: 44px; height: 44px; font-size: 1.2rem; }
            .header { padding: 0.6rem 0.8rem; }
            .header-title { font-size: 1rem; }
        }

        /* Portrait-dominant devices: occupy vertical space and enlarge cards for better visibility */
        @media (orientation: portrait) {
            .carousel-container {
                /* Fill the available vertical space under the header */
                height: calc(100vh - 96px);
                max-height: none;
                display: flex;
                align-items: center;
                padding-bottom: 1rem;
            }

            /* Make cards larger so they occupy most of the viewport width */
            .certificate-card { flex: 0 0 88%; min-width: 88%; }

            /* Ensure indicators don't push content down on very small portrait screens */
            .carousel-indicators { margin-top: 0.8rem; }

            /* Keep nav arrows visible and overlayed at the sides */
            .carousel-nav { pointer-events: none; }
            .nav-arrow { pointer-events: auto; z-index: 30; }
        }

        @media (max-width: 480px) {
            .certificate-card { flex: 0 0 92%; min-width: 92%; }
            .certificate-title { font-size: 0.95rem; }
            .card-header { height: 48px; }
            .view-btn, .modal-open-btn { padding: 1rem 1.1rem; font-size: 1rem; border-radius: 10px; }
            .modal-content { width: 100%; height: 100%; max-width: 100%; max-height: 100vh; border-radius: 0; padding: 1.0rem; }
            .certificate-iframe, .certificate-image { max-height: 70vh; }
            .polygon-bg { display: none; }
        }

        /* Mobile phones */
        @media (max-width: 480px) {
            .certificate-card { flex: 0 0 92%; min-width: 92%; }
            .certificate-title { font-size: 0.95rem; }
            .card-header { height: 48px; }
            .view-btn, .modal-open-btn { padding: 1rem 1.1rem; font-size: 1rem; border-radius: 10px; }
            .modal-content { width: 100%; height: 100%; max-width: 100%; max-height: 100vh; border-radius: 0; padding: 1.0rem; }
            .certificate-iframe, .certificate-image { max-height: 70vh; }
            .polygon-bg { display: none; }
        }

        /* Very small devices */
        @media (max-width: 360px) {
            .certificate-title { font-size: 0.9rem; }
            .view-btn, .modal-open-btn { padding: 1rem; font-size: 0.95rem; }
            .header-title { font-size: 0.95rem; }
        }

        /* Ensure hover overlays appear above button backgrounds and text stays visible */
        .view-btn { z-index: 0; }
        .view-btn::before { z-index: 1; pointer-events: none; }
        .view-btn > * { position: relative; z-index: 2; }
        .modal-open-btn { z-index: 0; }
        .modal-open-btn::before { z-index: 1; pointer-events: none; }
        .modal-open-btn > * { position: relative; z-index: 2; }

        /* Ensure .open-cert-btn clips overlay smoothly */
        .open-cert-btn { overflow: hidden; }

    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo"><img src="logos.svg" alt="Logo"></div>
            <div class="header-title">Certificate Gallery</div>
        </div>
        <div class="back-container">
            <span class="back-line"></span>
            <a class="back-button" href="portfolio.html" id="backToPortfolio">Back to Home</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Polygonal Background -->
        <div class="polygon-bg">
            <div class="polygon"></div>
            <div class="polygon"></div>
            <div class="polygon"></div>
            <div class="polygon"></div>
        </div>

        <!-- Carousel -->
        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- Certificate cards will be dynamically inserted here -->
            </div>
            
            <!-- Navigation Arrows -->
            <div class="carousel-nav">
                <button class="nav-arrow prev-arrow" aria-label="Previous certificate">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <button class="nav-arrow next-arrow" aria-label="Next certificate">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <!-- Indicators -->
        <div class="carousel-indicators" id="indicators">
            <!-- Indicators will be dynamically inserted here -->
        </div>
        <div id="carouselStatus" class="sr-only" aria-live="polite"></div>



        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color major"></div>

        // DOM Elements
        const carouselTrack = document.getElementById('carouselTrack');

        // State variables
        let currentIndex = Math.floor(certificates.length / 2); // Start with middle card for center focus
        let cardWidth = 320;
        let cardGap = 32; // pixel fallback for spacing
        let hoveredIndex = null; // reserved for future hover logic (do not use to re-center)
        let isDragging = false;
        let startPosition = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let lastFocusedElement = null;
        let _focusTrapHandler = null;

        // Initialize the carousel
        function initCarousel() {
            // Clear existing content
            carouselTrack.innerHTML = '';
            indicators.innerHTML = '';
            
            // Create certificate cards
            certificates.forEach((cert, index) => {
                // Create card element
                const card = document.createElement('div');
                card.className = `certificate-card ${index === currentIndex ? 'active' : ''}`;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-header">
                        <i class="${cert.icon} certificate-icon"></i>
                    </div>
                    <div class="card-content">
                        <h3 class="certificate-title">${cert.title}</h3>
                        <div class="certificate-type ${cert.type}">
                            <i class="fas fa-${cert.type === 'major' ? 'award' : 'certificate'}"></i>
                            <span>${cert.type === 'major' ? 'Major Certificate' : 'Minor Certificate'}</span>
                        </div>
                        <div class="certificate-issuer">
                            <i class="fas fa-building"></i>
                            <span>${cert.issuer}</span>
                        </div>
                        <div class="certificate-date">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${cert.date}</span>
                        </div>
                        <button class="view-btn" onclick="viewCertificate(${index})" aria-label="View details for ${cert.title}">
                            <i class="fas fa-eye"></i> View Details
                        </button>
                    </div>
                `;

                // Make card keyboard/focus accessible and clickable
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `Open details for ${cert.title}`);
                card.setAttribute('aria-hidden', index === currentIndex ? 'false' : 'true');
                card.addEventListener('click', () => viewCertificate(index));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        viewCertificate(index);
                    }
                });

                    carouselTrack.appendChild(card);
                
                // Setup hover behavior for prioritizing hovered card
                card.addEventListener('pointerenter', () => {
                    hoveredIndex = index;
                    updateHoverStates();
                });

                card.addEventListener('pointerleave', () => {
                    hoveredIndex = null;
                    updateHoverStates();
                });
                
                // Create indicator (button for accessibility)
                const indicator = document.createElement('button');
                indicator.type = 'button';
                indicator.className = `indicator ${index === currentIndex ? 'active' : ''}`;
                indicator.dataset.index = index;
                indicator.setAttribute('aria-label', `Go to certificate ${index + 1}`);
                indicator.setAttribute('aria-current', index === currentIndex ? 'true' : 'false');
                indicator.addEventListener('click', () => {
                    goToSlide(index);
                });
                indicators.appendChild(indicator);
            });
            
            updateCardWidth();
            updateCarouselPosition();
            updateHoverStates();

            // Mobile: listen for scroll to update focused card when using native swipe
            let mobileScrollDebounce;
            carouselTrack.addEventListener('scroll', () => {
                if (!isMobileView()) return;
                clearTimeout(mobileScrollDebounce);
                mobileScrollDebounce = setTimeout(() => {
                    const trackRect = carouselTrack.getBoundingClientRect();
                    const children = Array.from(carouselTrack.querySelectorAll('.certificate-card'));
                    let nearestIndex = currentIndex;
                    let nearestDistance = Infinity;
                    children.forEach((child, idx) => {
                        const childRect = child.getBoundingClientRect();
                        const childCenter = childRect.left + childRect.width / 2;
                        const distance = Math.abs(childCenter - (trackRect.left + trackRect.width / 2));
                        if (distance < nearestDistance) { nearestDistance = distance; nearestIndex = idx; }
                    });
                    if (nearestIndex !== currentIndex) {
                        currentIndex = nearestIndex;
                        document.querySelectorAll('.indicator').forEach((indicator, index) => {
                            indicator.classList.toggle('active', index === currentIndex);
                            indicator.setAttribute('aria-current', index === currentIndex ? 'true' : 'false');
                        });
                        updateAccessibilityStates();
                    }
                }, 120);
            }, { passive: true });
        }

        // Helper: detect mobile view (matches CSS breakpoint)
        function isMobileView() {
            return window.innerWidth <= 768;
        }

        // Update card width and gap
        function updateCardWidth() {
            const card = document.querySelector('.certificate-card');
            if (card) {
                const computed = window.getComputedStyle(carouselTrack);
                const gapValue = parseFloat(computed.gap) || 16; // read computed gap (px) or fallback
                cardGap = gapValue;
                cardWidth = card.offsetWidth; // only card's width; gap handled separately
            }
            // Reposition carousel after recalculation
            updateCarouselPosition();
        }

        // Update carousel position
        function updateCarouselPosition() {
            // If mobile, prefer native scroll-snap behavior; do not set transform
            if (isMobileView()) { updateAccessibilityStates(); return; }
            // Always center the currentIndex — hovering should NOT re-center the track
            const centerIndex = currentIndex;

            // Calculate offset to center the active card
            const containerWidth = carouselTrack.parentElement.offsetWidth;
            const cardCenterOffset = cardWidth / 2;
            const containerCenter = containerWidth / 2;
            const activeCardPosition = centerIndex * (cardWidth + cardGap); // cardWidth + gap
            const offset = containerCenter - cardCenterOffset - activeCardPosition;

            carouselTrack.style.transform = `translateX(${offset}px)`;

            // Keep indicators tied to the real currentIndex and announce state
            document.querySelectorAll('.indicator').forEach((indicator, index) => {
                const isActive = index === currentIndex;
                indicator.classList.toggle('active', isActive);
                indicator.setAttribute('aria-current', isActive ? 'true' : 'false');
            });

            // Update visual active/hover states (do not alter centering)
            updateHoverStates();
            // Announce current slide for screen readers
            const _status = document.getElementById('carouselStatus');
            if (_status) _status.textContent = `Viewing ${currentIndex + 1} of ${certificates.length}: ${certificates[currentIndex].title}`;
            updateAccessibilityStates();
        }

        // Update progress bar and diamond position
        function updateProgress() {
            const totalSlides = certificates.length;
            const progressPercentage = ((currentIndex + 1) / totalSlides) * 100;

            const progressBar = document.getElementById('progressBar');
            const progressDiamond = document.getElementById('progressDiamond');

            if (progressBar) {
                progressBar.style.width = `${progressPercentage}%`;
            }

            if (progressDiamond) {
                progressDiamond.style.left = `${progressPercentage}%`;
            }

            // Optional enhanced effects (clean, safe)
            if (progressDiamond) {
                if (progressPercentage >= 80) {
                    progressDiamond.style.boxShadow = '0 0 30px rgba(255, 107, 107, 0.9)';
                } else {
                    progressDiamond.style.boxShadow = '0 0 12px rgba(255, 107, 107, 0.6)';
                }
            }
        }

        // Update hover/active states so only hovered card is prioritized
        function updateHoverStates() {
            document.querySelectorAll('.certificate-card').forEach((card, idx) => {
                if (hoveredIndex !== null) {
                    // While a card is hovered: prioritize hovered card only
                    card.classList.toggle('hovered', idx === hoveredIndex);
                    card.classList.toggle('active', false);
                } else {
                    // Restore normal active state tied to currentIndex
                    card.classList.toggle('hovered', false);
                    card.classList.toggle('active', idx === currentIndex);
                }
            });
        }

        // Accessibility: set aria-hidden on inactive cards and announce state
        function updateAccessibilityStates() {
            const cards = document.querySelectorAll('.certificate-card');
            cards.forEach((card, idx) => {
                card.setAttribute('aria-hidden', idx === currentIndex ? 'false' : 'true');
            });
            // Update indicators aria-current too (safeguard)
            document.querySelectorAll('.indicator').forEach((indicator, idx) => {
                indicator.setAttribute('aria-current', idx === currentIndex ? 'true' : 'false');
            });
            const _status = document.getElementById('carouselStatus');
            if (_status) _status.textContent = `Viewing ${currentIndex + 1} of ${certificates.length}: ${certificates[currentIndex].title}`;
        }

        // Focus trap helpers for modal dialogs (basic, works without external libs)
        function enableFocusTrap(modal) {
            const focusableSelectors = 'a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';
            const focusable = Array.from(modal.querySelectorAll(focusableSelectors)).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            _focusTrapHandler = function(e) {
                if (e.key === 'Tab') {
                    if (e.shiftKey) { // tab backwards
                        if (document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        }
                    } else { // tab forwards
                        if (document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                }
            };
            document.addEventListener('keydown', _focusTrapHandler);
        }

        function disableFocusTrap() {
            if (_focusTrapHandler) {
                document.removeEventListener('keydown', _focusTrapHandler);
                _focusTrapHandler = null;
            }
        }



        // Navigate to slide
        function goToSlide(index) {
            currentIndex = index;
            if (currentIndex < 0) currentIndex = certificates.length - 1;
            if (currentIndex >= certificates.length) currentIndex = 0;
            
            // If mobile view uses native scroll-snap, programmatically scroll the active card into view
            if (isMobileView()) {
                const target = carouselTrack.querySelector(`.certificate-card[data-index="${currentIndex}"]`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
                // Update indicators & accessibility states
                document.querySelectorAll('.indicator').forEach((indicator, idx) => {
                    const isActive = idx === currentIndex;
                    indicator.classList.toggle('active', isActive);
                    indicator.setAttribute('aria-current', isActive ? 'true' : 'false');
                });
                updateHoverStates();
                updateAccessibilityStates();
                return;
            }

            updateCarouselPosition();
            updateHoverStates();
        }

        // View certificate details
        function viewCertificate(index) {
            const cert = certificates[index];

            modalDetails.innerHTML = `
                <div class="certificate-inner-container">

                        <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">

                                <i class="fas fa-${cert.type === 'major' ? 'award' : 'certificate'}"
                                   style="color: ${cert.type === 'major' ? '#1bc35e' : '#2196f3'}"></i>
                                <span style="color: ${cert.type === 'major' ? '#1bc35e' : '#2196f3'}; font-weight: 600;">
                                    ${cert.type === 'major' ? 'Major Certificate' : 'Minor Certificate'}
                                </span>
                            </div>

                            <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
                                 background: rgba(33, 150, 243, 0.1); border-radius: 10px;">
                                <i class="fas fa-building" style="color: #2196f3"></i>

                            </div>

                            <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;

                            </div>

                        <div style="background: rgba(0, 188, 212, 0.05); padding: 1.5rem; border-radius: 10px;

                                ${cert.details}

                        <div style="display: flex; justify-content: space-between; align-items: center;
                             margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(33, 150, 243, 0.3);">
                            <div>
                                <h3 style="color: #2196f3; margin-bottom: 0.5rem;">Certificate ID</h3>
                                <div style="font-family: monospace; font-size: 1.1rem; padding: 0.5rem 1rem;
                                     background: rgba(0, 0, 0, 0.2); border-radius: 5px; display: inline-block;">
                                    CERT-${String(cert.id).padStart(3, '0')}
                                </div>
                            </div>

                            <button onclick="openCertificate('${cert.file}')" class="open-cert-btn modal-open-btn" aria-label="Open full certificate">
                                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                                Open Full Certificate
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // save active element to restore focus later
            lastFocusedElement = document.activeElement;
            certModal.classList.add('active');
            certModal.setAttribute('aria-hidden', 'false');
            document.querySelector('.main-container').setAttribute('aria-hidden', 'true');
            document.body.style.overflow = 'hidden';
            // focus the close button for keyboard users
            setTimeout(() => modalClose.focus(), 80);
            // Enable focus trap inside modal
            enableFocusTrap(certModal);
        }

        // Open certificate in viewer
        function openCertificate(file) {
            const modalDetails = document.getElementById('modalDetails');
            const certificateViewer = document.getElementById('certificateViewer');

            // Hide details and show viewer
            modalDetails.style.display = 'none';
            certificateViewer.classList.add('active');

            // Clear previous content
            certificateViewer.innerHTML = '';

            // Check file extension to determine how to display
            const fileExtension = file.split('.').pop().toLowerCase();

            if (fileExtension === 'pdf') {
                // Display PDF using iframe
                const iframe = document.createElement('iframe');
                iframe.src = file;
                iframe.className = 'certificate-iframe';
                iframe.style.width = '100%';
                iframe.style.height = '80vh';
                certificateViewer.appendChild(iframe);
            } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExtension)) {
                // Display image
                const img = document.createElement('img');
                img.src = file;
                img.className = 'certificate-image';
                img.style.maxWidth = '100%';
                img.style.maxHeight = '80vh';
                img.style.objectFit = 'contain';
                certificateViewer.appendChild(img);
            } else {
                // Fallback: try to display as image or show download link
                const img = document.createElement('img');
                img.src = file;
                img.className = 'certificate-image';
                img.style.maxWidth = '100%';
                img.style.maxHeight = '80vh';
                img.style.objectFit = 'contain';
                img.onerror = function() {
                    // If image fails to load, show download link
                    certificateViewer.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <p style="color: #e0f7fa; margin-bottom: 1rem;">Unable to preview this file type.</p>
                            <a href="${file}" download style="color: #00bcd4; text-decoration: none; padding: 0.5rem 1rem; border: 1px solid #00bcd4; border-radius: 5px;">
                                Download Certificate
                            </a>
                        </div>
                    `;
                };
                certificateViewer.appendChild(img);
            }
        }

        // Handle URL parameters for certificate viewing
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            if (file) {
                // Automatically open the certificate modal if file parameter is present
                const certIndex = certificates.findIndex(cert => cert.file === file);
                if (certIndex !== -1) {
                    viewCertificate(certIndex);
                }
            }
        });

        // Event Listeners
        prevArrow.addEventListener('click', () => goToSlide(currentIndex - 1));
        nextArrow.addEventListener('click', () => goToSlide(currentIndex + 1));

        modalClose.addEventListener('click', () => {
            certModal.classList.remove('active');
            certModal.setAttribute('aria-hidden', 'true');
            document.querySelector('.main-container').removeAttribute('aria-hidden');
            document.body.style.overflow = '';
            // Disable focus trap and restore focus
            disableFocusTrap();
            if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
            // Reset modal to details view
            setTimeout(() => {
                const modalDetails = document.getElementById('modalDetails');
                const certificateViewer = document.getElementById('certificateViewer');
                modalDetails.style.display = 'block';
                certificateViewer.classList.remove('active');
            }, 400); // Wait for modal close animation
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
            if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
            if (e.key === 'Escape') {
                certModal.classList.remove('active');
                certModal.setAttribute('aria-hidden', 'true');
                document.querySelector('.main-container').removeAttribute('aria-hidden');
                document.body.style.overflow = '';
                disableFocusTrap();
                if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
            }
        });

        // Close modal when clicking outside
        certModal.addEventListener('click', (e) => {
            if (e.target === certModal) {
                certModal.classList.remove('active');
                certModal.setAttribute('aria-hidden', 'true');
                document.querySelector('.main-container').removeAttribute('aria-hidden');
                document.body.style.overflow = '';
                disableFocusTrap();
                if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') lastFocusedElement.focus();
            }
        });

        // Touch/Mouse drag support
        let touchStartX = 0;
        let touchEndX = 0;

        carouselTrack.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, {passive: true});

        carouselTrack.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].clientX;
            handleSwipe();
        }, {passive: true});

        carouselTrack.addEventListener('mousedown', (e) => {
            touchStartX = e.clientX;
            document.addEventListener('mouseup', handleMouseSwipe);
        });

        function handleMouseSwipe(e) {
            touchEndX = e.clientX;
            handleSwipe();
            document.removeEventListener('mouseup', handleMouseSwipe);
        }

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left
                    goToSlide(currentIndex + 1);
                } else {
                    // Swipe right
                    goToSlide(currentIndex - 1);
                }
            }
        }

        // Initialize on load
        window.addEventListener('load', initCarousel);
        window.addEventListener('resize', updateCardWidth);

        // Auto-rotate (optional)
        let autoRotateInterval;
        
        function startAutoRotate() {
            autoRotateInterval = setInterval(() => {
                goToSlide(currentIndex + 1);
            }, 5000);
        }
        
        function stopAutoRotate() {
            clearInterval(autoRotateInterval);
        }
        
        // Auto-rotate disabled as per request
        // startAutoRotate();

        // Pause on hover (disabled since auto-rotate is off)
        // carouselTrack.addEventListener('mouseenter', stopAutoRotate);
        // carouselTrack.addEventListener('mouseleave', startAutoRotate);
        // carouselTrack.addEventListener('touchstart', stopAutoRotate);
        // carouselTrack.addEventListener('touchend', () => {
            // setTimeout(startAutoRotate, 3000);
        // });

        // Back button navigation with smooth transition
        document.getElementById('backToPortfolio').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            sessionStorage.setItem('restoreCertBack', '1');
            setTimeout(() => {
                window.location.href = 'portfolio.html#Certifications';
