<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading | SeanScript Development</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --text-dark: #f1f5f9;
      --bg-light: #f5f9ff;
      --text-light: #0f172a;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --accent-dark: #1e40af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #ffffff;
      color: var(--text-light);
      position: relative;
    }

    /* White background */
    .gradient-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: #ffffff;
    }

    /* Floating particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.3;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }

  

    @keyframes orbFloat {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(50px, -50px) scale(1.1);
      }
      66% {
        transform: translate(-50px, 50px) scale(0.9);
      }
    }

    .loading-content {
      text-align: center;
      z-index: 10;
      max-width: 90%;
      position: relative;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 156px;
      height: 156px;
      margin: 0 auto 2rem;
      position: relative;
      overflow: hidden;
    }

    .logo svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 0;
    }

    .logo::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 2;
      animation: logoReveal 6s ease-out forwards;
    }

    @keyframes logoReveal {
      0% {
        transform: translateY(0%);
      }
      100% {
        transform: translateY(-100%);
      }
    }

    .logo svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 0;
    }

    .brand {
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .brand-name {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      font-weight: 500;
    }

    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.7s forwards;
    }

    .loading-text {
      font-size: 1rem;
      margin-bottom: 1.5rem;
      opacity: 0.8;
      font-weight: 500;
    }

    .progress-container {
      width: 250px;
      height: 2px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
      border-radius: 0;
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      display: none;
    }

    .fade-out {
      opacity: 0;
      transition: opacity 1s ease;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: var(--bg-dark);
        color: var(--text-dark);
      }
      
      .gradient-background {
        background: #1a1a1a;
      }
      
      .progress-container {
        background: rgba(255, 255, 255, 0.1);
      }
    }

    @media (max-width: 768px) {
      .logo {
        width: 130px;
        height: 130px;
        margin-bottom: 1.5rem;
      }
      
      .brand-name {
        font-size: 2rem;
      }
      
      .brand-tagline {
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
      
      .progress-container {
        width: 200px;
      }
      
      .orb-1, .orb-2, .orb-3 {
        width: 250px;
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <div class="loading-content">

      </svg>
    </div>

    <div class="brand">
      <h1 class="brand-name">SeanScript</h1>
      <div class="brand-tagline">Development</div>
    </div>

    <div class="loading-indicator">
      <div class="loading-text">Loading portfolio...</div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Simulate loading progress (7.5 seconds total - 2x faster)
      let progress = 0;
      const progressBar = document.getElementById('progress-bar');
      const totalDuration = 4000; // 7.5 seconds (15s / 2)
      const updateInterval = 100; // Update every 100ms
      const totalSteps = totalDuration / updateInterval;
      
      let currentStep = 0;
      const progressInterval = setInterval(() => {
        currentStep++;
        // Smooth linear progression
        progress = (currentStep / totalSteps) * 100;
        
        if (progress >= 100) {
          progress = 100;
          clearInterval(progressInterval);
          
          // Transition to portfolio after loading completes
          setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
              window.location.href = "portfolio.html?fadein=1";
            }, 1000);
          }, 500);
        }
        progressBar.style.width = `${progress}%`;
      }, updateInterval);
    });
  </script>
</body>
</html>
